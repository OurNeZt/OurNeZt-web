name: ci

on:
  pull_request:
    branches: [dev, stable]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Go files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

  frontend-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify committed frontend assets are current
        run: |
          npm run build:assets
          git diff --exit-code -- static/vendor

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, frontend-assets]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ournezt-web:test .
