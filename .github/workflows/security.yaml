name: Security

on:
  pull_request:
    branches: [dev, stable]
  push:
    branches: [dev, stable]
  schedule:
    # Daily at 09:19 Singapore time; scheduled scans use the default branch.
    - cron: "19 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      # Go may download a newer toolchain to build the scanner itself.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Check reachable Go vulnerabilities
        run: govulncheck ./...

  npm-audit:
    name: Frontend dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      # Frontend libraries are devDependencies but are shipped in static/vendor.
      - name: Audit all locked dependencies, including development dependencies
        run: npm audit --package-lock-only --include=dev --audit-level=low
